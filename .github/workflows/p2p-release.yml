name: Release Serein P2P

on:
  push:
    tags:
      - 'v*p2p*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (ex: v1.0.0-p2p.1)'
        required: true
        default: 'v1.0.0-p2p.1'

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64 Release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo bash packaging/linux/install-build-deps.sh

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p serein --bin serein

      - name: Package Linux release archive
        run: |
          PKG_NAME="serein-linux-x86_64-p2p"
          rm -rf "$PKG_NAME"
          mkdir -p "$PKG_NAME"
          cp target/release/serein "$PKG_NAME/serein"
          chmod +x "$PKG_NAME/serein"
          cp install.sh "$PKG_NAME/install.sh"
          chmod +x "$PKG_NAME/install.sh"
          cp packaging/p2p/serein-p2p.png "$PKG_NAME/serein-p2p.png"
          cp README.md "$PKG_NAME/README.md"
          cp LICENSE-MIT "$PKG_NAME/LICENSE-MIT" 2>/dev/null || true
          cp LICENSE-APACHE "$PKG_NAME/LICENSE-APACHE" 2>/dev/null || true

          tar -czf "${PKG_NAME}.tar.gz" "$PKG_NAME"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Serein P2P ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Serein P2P — Transmissão de Tela Direta via QUIC / Tailscale / LAN

            Esta versão customizada do Serein permite compartilhar tela diretamente por P2P de alta fidelidade e baixíssima latência (60–165 fps), contornando limitações de rota da infraestrutura de mídia do Discord e sem exigir Nitro ou permissões de servidor.

            ### 🚀 Instalação Rápida no Linux (x86_64)

            Baixe e instale mantendo o Serein original preservado:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/rrSacer/Serein/main/install.sh | bash
            ```

            Ou baixe o arquivo `serein-linux-x86_64-p2p.tar.gz`, extraia e execute `./install.sh`.
          files: |
            serein-linux-x86_64-p2p.tar.gz
            serein-linux-x86_64-p2p.tar.gz.sha256
            install.sh
